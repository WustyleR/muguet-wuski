name: Build iOS IPA

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "game.wasm dosyasinin yuklu oldugu release etiketi"
        default: "game"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Xcode surumunu goster
        run: xcodebuild -version

      - name: Rust toolchain kur
        run: |
          rustup update stable
          rustup toolchain install 1.98.1 --profile minimal
          rustup target add aarch64-apple-ios --toolchain 1.98.1

      - name: xcodegen kur
        run: brew install xcodegen

      - name: game.wasm indir (private release'den)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${{ inputs.release_tag }}" --pattern "game.wasm" --dir .
          ls -lh game.wasm

      - name: IPA olustur
        run: |
          chmod +x make-ios.sh
          ./make-ios.sh game.wasm --ipa

      - name: IPA'yi artifact olarak yukle
        uses: actions/upload-artifact@v4
        with:
          name: Muguet-ipa
          path: build/Muguet.ipa
          retention-days: 3
